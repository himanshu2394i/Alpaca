[project]
name = "alpaca-options-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "alpaca-py>=0.33",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "anthropic>=0.117",
    "mcp>=1.0",
    "alpaca-mcp-server>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
